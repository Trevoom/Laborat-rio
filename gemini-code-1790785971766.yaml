flowcharting:
  rules:
    # ============================================================
    # REGRA 1: STATUS DOS DISPOSITIVOS / FIREWALLS (NÓS)
    # ============================================================
    - name: "Status dos Firewalls (Matrizes e Filiais)"
      pattern: "/.*/"                        # Captura o alias enviado pelo setAlias() no Grafana
      type: "number"
      metricType: "serie"
      valueName: "last"                      # Avalia o último ponto recebido (0 = Offline, 1 = Online)
      shapes:
        # MATRIZES (Blocos do Topo)
        - cellId: "cFVbnaZPmClY6NMVLDsi-1"   # SKYONE (10.122.67.144)
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-3"   # VP
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-4"   # CMP
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-5"   # SAMAMBAIA NORTE
          colorMode: "stroke"

        # FILIAIS (Blocos da Base)
        - cellId: "w4PNDmOhjg6-sdR7XbyK-9"   # AGUAS LINDAS I
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-1"   # AGUAS LINDAS II
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-6"   # CEILANDIA
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-7"   # EPTG
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-8"   # GARAVELO
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-10"  # GYN CENTRO
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-21"  # GYN PORTAL
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-19"  # GYN T7
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-20"  # LUZIANIA
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-17"  # MONTEMAR
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-18"  # OFICINA
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-11"  # PAPILON
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-12"  # RECANTO
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-13"  # RESIDENCIA
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-14"  # SAMAMBAIA SUL
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-15"  # SANTA MARIA
          colorMode: "stroke"
        - cellId: "w4PNDmOhjg6-sdR7XbyK-16"  # SOBRADINHO
          colorMode: "stroke"

      thresholds:
        - value: 0
          color: "rgba(245, 54, 54, 0.9)"    # Vermelho (OFFLINE)
          level: 2
        - value: 1
          color: "rgba(50, 172, 45, 0.9)"    # Verde (ONLINE)
          level: 0
      options:
        blink: true                         # Pisca a borda em vermelho em caso de queda


